name: Libra CI (Fast)

on:
  push:
    branches: [devel]
  pull_request:

env:
  BUILD_DIR: _build
  CONDA_ENV: libra

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]

    defaults:
      run:
        shell: bash -l {0}

    steps:
      # ----------------------------
      # Checkout
      # ----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------
      # Cache Conda packages
      # ----------------------------
      - name: Cache conda packages
        uses: actions/cache@v4
        with:
          path: ~/conda_pkgs_dir
          key: conda-pkgs-${{ runner.os }}-${{ hashFiles('environment.yml') }}
          restore-keys: |
            conda-pkgs-${{ runner.os }}-

      # ----------------------------
      # Setup Conda + Mamba
      # ----------------------------
      - name: Setup Miniconda (with mamba)
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          activate-environment: ${{ env.CONDA_ENV }}
          environment-file: environment.yml
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          channel-priority: strict
          use-mamba: true
          mamba-version: "*"

      # ----------------------------
      # Cache full Conda environment
      # ----------------------------
      - name: Cache conda environment
        uses: actions/cache@v4
        with:
          path: ~/miniconda3/envs/${{ env.CONDA_ENV }}
          key: conda-env-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('environment.yml') }}

      # ----------------------------
      # Environment sanity check
      # ----------------------------
      - name: Verify environment
        run: |
          conda info
          conda list
          python --version
          cmake --version
          g++ --version

      # ----------------------------
      # Cache build directory (CMake)
      # ----------------------------
      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: ${{ env.BUILD_DIR }}
          key: build-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('CMakeLists.txt', 'environment.yml') }}


      - name: Check Eigen installation
        run: |
          conda list eigen
          find ${CONDA_PREFIX}/include/eigen3 -name Macros.h


      - name: Check Eigen version header
        run: |
          grep EIGEN_WORLD_VERSION \
            ${CONDA_PREFIX}/include/eigen3/Eigen/src/Core/util/Macros.h

          grep EIGEN_MAJOR_VERSION \
            ${CONDA_PREFIX}/include/eigen3/Eigen/src/Core/util/Macros.h

          grep EIGEN_MINOR_VERSION \
            ${CONDA_PREFIX}/include/eigen3/Eigen/src/Core/util/Macros.h


      # ----------------------------
      # Configure
      # ----------------------------
      - name: Configure CMake
        run: |
          rm -rf ${BUILD_DIR}
          mkdir -p ${BUILD_DIR}

          cmake \
            -S . \
            -B ${BUILD_DIR} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=${CONDA_PREFIX} \
            -DCMAKE_INSTALL_PREFIX=${CONDA_PREFIX} \
            -DBOOST_ROOT=${CONDA_PREFIX} \
            -DBoost_NO_SYSTEM_PATHS=ON \
            -DBoost_NO_BOOST_CMAKE=ON \
            -DPython3_EXECUTABLE=${CONDA_PREFIX}/bin/python \
            -DPython3_ROOT_DIR=${CONDA_PREFIX} \
            -DCMAKE_IGNORE_PATH="/usr;/usr/lib;/usr/include"

      # ----------------------------
      # Build
      # ----------------------------
      - name: Build Libra
        run: |
          cd ${BUILD_DIR}
          make -j$(nproc)

      # ----------------------------
      # Show artifacts
      # ----------------------------
      - name: Inspect build outputs
        run: |
          find ${BUILD_DIR} -type f | sort

      # ----------------------------
      # Runtime environment
      # ----------------------------
      - name: Setup runtime paths
        run: |
          echo "PYTHONPATH=${GITHUB_WORKSPACE}/${BUILD_DIR}/src:${PYTHONPATH}" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=${GITHUB_WORKSPACE}/${BUILD_DIR}/src:${LD_LIBRARY_PATH}" >> $GITHUB_ENV

      # ----------------------------
      # Smoke test Python
      # ----------------------------
      - name: Smoke test Python
        run: |
          python - << 'EOF'
          import sys
          print(sys.version)
          print(sys.executable)
          print("PYTHONPATH:")
          for p in sys.path:
              print("  ", p)
          EOF

      # ----------------------------
      # Libra import test
      # ----------------------------
      - name: Smoke test Libra import
        continue-on-error: true
        run: |
          python - << 'EOF'
          try:
              import liblibra_core
              print("OK: liblibra_core imported")
          except Exception as e:
              print("Import failed:", e)
              raise
          EOF

      # ----------------------------
      # Tests
      # ----------------------------
      #- name: Run tests
      #  continue-on-error: false
      #  run: |
      #    if [ -d tests ]; then
      #        python -m pytest -v tests
      #    elif [ -d unittests ]; then
      #        python -m pytest -v unittests
      #    else
      #        echo "No test suite found."
      #    fi

      # ----------------------------
      # Upload build (optional)
      # ----------------------------
      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: libra-build
          path: _build/
