name: Libra CI

on:
push:
branches:
- master
- devel
pull_request:
workflow_dispatch:

env:
BUILD_DIR: build

jobs:
build-and-test:

```
runs-on: ubuntu-latest

strategy:
  fail-fast: false
  matrix:
    python-version: ["3.10"]

defaults:
  run:
    shell: bash -l {0}

steps:

  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Miniconda
    uses: conda-incubator/setup-miniconda@v3
    with:
      activate-environment: libra
      environment-file: environment.yml
      auto-activate-base: false
      channels: conda-forge
      channel-priority: strict
      python-version: ${{ matrix.python-version }}

  - name: Verify environment
    run: |
      conda info
      conda list

      which python
      python --version

      which cmake
      cmake --version

      which g++
      g++ --version

  - name: Configure build
    run: |
      mkdir -p ${BUILD_DIR}
      cd ${BUILD_DIR}

      cmake \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_PREFIX_PATH=${CONDA_PREFIX} \
        -DBOOST_ROOT=${CONDA_PREFIX} \
        ..

  - name: Build Libra
    run: |
      cd ${BUILD_DIR}
      make -j$(nproc)

  - name: Show build products
    run: |
      find ${BUILD_DIR} -type f | sort

  - name: Setup runtime paths
    run: |
      echo "PYTHONPATH=${GITHUB_WORKSPACE}/${BUILD_DIR}/src:${PYTHONPATH}" >> $GITHUB_ENV
      echo "LD_LIBRARY_PATH=${GITHUB_WORKSPACE}/${BUILD_DIR}/src:${LD_LIBRARY_PATH}" >> $GITHUB_ENV

  - name: Locate Python extension modules
    run: |
      find ${BUILD_DIR} \
        \( -name "*.so" -o -name "*.pyd" \) \
        | sort

  - name: Smoke test Python
    run: |
      python - << 'EOF'
      import sys
      print("Python version:", sys.version)
      print("Executable:", sys.executable)
      print("PYTHONPATH:")
      for p in sys.path:
          print("  ", p)
      EOF

  #
  # Replace with actual Libra imports if known
  #
  - name: Smoke test Libra import
    continue-on-error: true
    run: |
      python - << 'EOF'
      try:
          import liblibra_core
          print("liblibra_core imported successfully")
      except Exception as e:
          print("Import failed:", e)
          raise
      EOF

  #
  # Run tests if available
  #
  - name: Run pytest suite
    continue-on-error: false
    run: |
      if [ -d tests ]; then
          python -m pytest -v tests
      elif [ -d unittests ]; then
          python -m pytest -v unittests
      else
          echo "No tests directory found."
      fi

  - name: Upload build artifacts
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: libra-build
      path: |
        build/
```

